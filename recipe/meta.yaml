{% set name = "upolygon" %}
{% set version = "0.2.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/v7labs/upolygon/archive/v{{ version }}.zip
  sha256: a1799867b7f9d84e9b4b2a0e7ca8358e14980989f9486639b0994b29d6138556

build:
  number: 0
  skip: true  # [py2k]
  script: {{ PYTHON }} -m pip install . -vv  # [win]
  script: USE_CYTHON=true {{ PYTHON }} -m pip install . -vv  # [not win]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
  host:
    - cython  # [not win]
    - pip
    - python
    - setuptools
  run:
    - python
    - numpy

test:
  source_files:
    - tests
  imports:
    - upolygon
  commands:
    - pip check
    - pytest
  requires:
    - pip
    - pytest
    - numpy

about:
  home: https://github.com/v7labs/upolygon
  summary: Collection of fast polygon operations for DL
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - hajapy
    - simedw
